<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-time Message Feed | Firebase & Node.js</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .alert {
      animation: fadeIn 0.4s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-sm navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-broadcast me-2"></i>Real-time Message Feed
      </a>
      <span class="navbar-text small text-light">Firebase Realtime Database & Node.js</span>
    </div>
  </nav>

  <main class="container my-3" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Incoming Messages</h1>
      <span class="badge bg-secondary" id="connection-status">Connecting to Firebase...</span>
    </div>

    <!-- Messages Container (Section 8 - Challenge B) -->
    <div id="messages" class="d-flex flex-column gap-2">
      <!-- Alerts will be automatically inserted here by js/index.js -->
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/index.js"></script>
</body>
</html>
